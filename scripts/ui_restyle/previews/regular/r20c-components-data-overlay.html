<!doctype html><html><head><meta charset="utf-8"><title>r20c Component sheet 3: StatPanel, SegmentedBar, FactList, StatusCluster, CashChip, Modal, Toast, PromptBanner</title><script src="../shared/boot.js"></script></head><body><script>
const SP = "position:relative;right:auto;top:auto";
P.page(`
  ${P.scene("city", "", 0.5)}${sheetHead("COMPONENT SHEET 3 / 3","STAT PANEL &middot; SEGMENTED BAR &middot; FACT LIST &middot; STATUS CLUSTER &middot; CASH CHIP &middot; MODAL &middot; TOAST &middot; PROMPT BANNER")}
  <div class="sec rowx" style="top:112px;gap:20px;align-items:flex-start">
    ${cell("StatPanel", P.statpanel({style:SP,name:"ZEPHYR",badge:"<span>D</span><span>390</span>",sub:[["EXOTIC &middot; PERFORMANCE",""]],stats:[["SPEED",77],["ACCEL",74],["HANDLING",74],["DRIFT",72],["BRAKING",73],["BOOST",72]]}))}
    ${cell("StatPanel &middot; preview: gain cyan, loss pink, each with an arrow", P.statpanel({style:SP,name:"STINGER",badge:"<span>D</span><span>321</span>",sub:[["FITTED WING","Spine Wing Standard"],["PREVIEWING","Spine Wing EVO"]],stats:[["SPEED",80],["ACCEL",74],["HANDLING",66,3],["DRIFT",63,2],["BRAKING",62],["BOOST",59,-2]]}))}
    <div class="col g24">
      ${cell("StatusCluster &middot; driving (HUD, menus)", P.status({static:1,tier:"S",rating:939}))}
      ${cell("StatusCluster &middot; garage screens: spaces, with + buttons", P.status({static:1,garage:"3 / 4",plus:1}))}
      ${cell("StatusCluster &middot; on foot", P.status({static:1}))}
      <div class="flex g24" style="align-items:flex-end">
        ${cell("CashChip (fixed width while counting)", `<div class="cash fixed">${P.ic("coin")}<span class="t-status">$3,613,709</span></div>`)}
        ${cell("compact above 1M", `<div class="cash">${P.ic("coin")}<span class="t-status">$12.4M</span></div>`)}
      </div>
    </div>
    <div class="col g24" style="width:300px">
      ${cell("SegmentedBar", `<div class="col g12">${P.segbar(80)}${P.segbar(60,12)}${P.segbar(62,-12)}${P.segbar(0)}</div>`)}
      ${cell("Progress (rank, timers)", `<div class="progress" style="width:205px"><i style="width:40%"></i></div>`)}
      ${cell("Checkpoint pips", P.pips(8,5))}
    </div>
  </div>
  <div class="sec rowx" style="top:626px;gap:20px;align-items:flex-start">
    ${cell("Modal / Confirm: NO left and focused, YES right", P.modal("EXIT RACE?", `<div class="t-body" style="font-size:24px">You will leave the race and return to the start. Your position is not saved.</div>`, [P.btn("NO","","md focus"),P.btn("YES","","md main nochev")], "width:600px;padding:28px 32px", "static"))}
    <div class="col g12" style="width:560px">
      <div class="panel" style="padding:6px 22px">${P.fact("route","ROUTE","CIRCUIT")}${P.fact("laps","LAPS","3")}${P.fact("players","PLAYERS","2 TO 6")}
        <div class="fact"><span class="t-label c-2">PRIZE</span><span class="v chip yellow lg">$10,000</span></div></div>
      ${L("FactList &middot; prize row ends in a yellow chip")}
    </div>
    <div class="col g8" style="width:640px;align-items:flex-start">
      ${P.toast("PLEASE WAIT.","","info")}${P.toast("ROUTE SET: SHOWROOM LOOP","ok","route")}${P.toast("TAXI FARE PAID &nbsp;<span class='c-yellow'>+$1,234</span>","money","coin")}${P.toast("GARAGE TRANSITION ALREADY IN PROGRESS.","err","warn")}
      ${L("Toast &middot; neutral, confirm, cash, error (edge colour + icon)")}
    </div>
  </div>
  <div class="abs col g8" style="left:60px;top:982px">
    <div class="flex g8">${P.prompt("ENTER","VEHICLE",P.key("E"),"").replace('class="prompt','style="min-width:330px;height:60px" class="prompt')}${P.prompt("ENTER","VEHICLE",P.glyph("X"),"").replace('class="prompt','style="min-width:330px;height:60px" class="prompt')}${P.prompt("ENTER","VEHICLE","","touch").replace('class="prompt','style="min-width:330px;height:60px" class="prompt')}
      <div style="align-self:center;margin-left:14px">${L("PromptBanner &middot; key cap, glyph, touch (the banner is the button)")}</div></div>
  </div>
`);
</script></body></html>
