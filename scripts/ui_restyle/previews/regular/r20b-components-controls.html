<!doctype html><html><head><meta charset="utf-8"><title>r20b Component sheet 2: Button, Tabs, Switch, Chip, TierBadge, key caps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,500;0,600;1,600;1,800;1,900&family=Barlow+Condensed:ital,wght@1,800&display=block">
<link rel="stylesheet" href="../shared/pulse.css"><script src="../shared/pulse.js"></script><script src="../shared/sheet.js"></script></head><body><script>
P.page(`
  ${P.scene("city", "", 0.5)}${sheetHead("COMPONENT SHEET 2 / 3","BUTTON &middot; TABS &middot; SWITCH &middot; CHIP &middot; TIER BADGE &middot; KEY CAP AND GLYPH")}
  <div class="sec rowx" style="top:128px;gap:14px">
    ${cell("Button &middot; default", P.btn("BACK","back"))}
    ${cell("hover / focus", P.btn("BACK","back","focus"))}
    ${cell("disabled (0.4, no hairline)", P.btn("DRIVE","wheel","dis"))}
    ${cell("Danger", P.btn("DESPAWN","close","danger"))}
    ${cell("Danger &middot; focus", P.btn("DESPAWN","close","danger focus"))}
  </div>
  <div class="sec rowx" style="top:290px;gap:14px">
    ${cell("Main (one per screen, right-most)", P.btn("DRIVE","wheel","main"))}
    ${cell("Main &middot; focus", P.btn("EQUIP","tick","main focus"))}
    ${cell("Main &middot; disabled", P.btn("EQUIP","tick","main dis"))}
    ${cell("Buy (spends Cash)", P.btn("BUY $150,000","","buy"))}
    ${cell("Buy &middot; focus", P.btn("BUY $150,000","","buy focus"))}
  </div>
  <div class="sec rowx" style="top:452px;gap:14px">
    ${cell("Buy &middot; unaffordable", P.btn("BUY $4.4M","","buy dis"))}
    ${cell("Medium (modals, panels)", `<div class="flex g8">${P.btn("NO","","md")}${P.btn("YES","","md main nochev")}</div>`)}
    ${cell("Small (HUD row)", `<div class="flex g8">${P.btn("CONTROLS","gamepad","sm")}${P.btn("EXIT VEHICLE","exit","sm focus")}</div>`)}
    ${cell("Icon &middot; default / open", `<div class="flex g8">${["car","garage","flag","wrench","sliders"].map((n,i)=>`<div class="btn icon ${i==1?"on":""}">${P.ic(n)}</div>`).join("")}</div>`)}
  </div>
  <div class="sec rowx" style="top:610px;gap:70px">
    <div class="col g12">${P.tabs([{l:"PARTS",i:"wrench",on:1},{l:"UPGRADES",i:"upgrade"},{l:"PAINT",i:"brush",locked:1},{l:"RACE",focus:1}],"static")}${L("Tabs &middot; active / inactive / locked / focus")}</div>
    <div class="col g12">${P.sw([{l:"SHOP"},{l:"OWNED",on:1}])}${L("Switch (two options)")}</div>
    <div class="col g12" style="width:380px">${P.segswitch([{l:"ROTATE",on:1},{l:"NORTH UP"}])}${L("Segmented switch (inside panels)")}</div>
    <div class="col g12" style="width:330px"><div class="slider" style="margin:14px 0"><i style="width:62%"></i><b style="left:62%"></b></div>${L("Slider (paint shop)")}</div>
  </div>
  <div class="sec rowx" style="top:740px;gap:70px">
    <div class="col g12"><div class="flex g8 ac">${["E","D","C","B","A","S"].map(t=>`<span class="tier">${t}</span>`).join("")}<span style="width:16px"></span><span class="tier inv">C</span><span class="tier locked">A</span><span style="width:16px"></span><span class="tierrating"><span>D</span><span>316</span></span><span style="width:16px"></span><span class="tier sm">S</span></div>
      ${L("TierBadge E&ndash;S (no tier colours) &middot; on white &middot; locked &middot; with rating &middot; small")}</div>
    <div class="col g12"><div class="flex g12 ac">${P.key("E")}${P.key("F")}${P.key("M")}${P.key("SPACE",1)}${P.key("ESC",1)}<span style="width:16px"></span>${P.glyph("X")}${P.glyph("A")}${P.glyph("B")}${P.glyph("Y")}${P.glyph("LB",1)}${P.glyph("RT",1)}</div>
      ${L("Key cap (keyboard) &middot; gamepad glyphs (image sprites in the build)")}</div>
  </div>
  <div class="sec col g12" style="top:870px">
    <div class="flex g8 ac"><span class="chip">FITTED</span><span class="chip">OWNED X2</span><span class="chip ink">GT</span><span class="chip white">EVO</span><span class="chip price">$6,000</span><span class="chip price unaff">$84,000</span>
      <span class="chip cyan">${P.ic("up")}+3</span><span class="chip pink">${P.ic("down")}-2</span><span class="chip yellow lg">$25,000</span><span class="chip cyan">-0.412</span><span class="chip pink">+1.204</span><span class="chip pink">EMPTY</span><span class="chip danger">WRONG WAY</span></div>
    ${L("Chip &middot; neutral, count, variant, variant on white, price, unaffordable, gain, loss, prize, lap delta faster / slower, empty slot, danger")}
  </div>
  <div class="abs note" style="left:60px;top:990px;width:1700px">Focus is always white fill with ink text. Filled buttons keep a 6 px base line in their role colour when focused (pink for Main, yellow for Buy, red for Danger) so the role survives; that base line is an addition to the style sheet. No key caps on buttons or tabs.</div>
`);
</script></body></html>
