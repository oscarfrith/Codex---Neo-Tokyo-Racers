<!doctype html><html><head><meta charset="utf-8"><title>r09 Free-roam My Vehicles side panel</title><script src="../shared/boot.js"></script></head><body><script>
/* Review 1 (2026-10-09): a full-height side panel on the left, as the Classic CarPanel (left edge, opened by the
   Car action button). While it is open the minimap, district name and rank arc are hidden, as are top-left cards. */
const owned = [
  ["S",939,"EXOTIC","SERAPH",1],["B",675,"EXOTIC","ENDURA"],["C",540,"EXOTIC","AURORA"],["C",512,"PIERCER","KESTREL"],["D",390,"EXOTIC","ZEPHYR"],["D",316,"EXOTIC","STINGER"]];
const vrow = (v) => `<div class="row ${v[4] ? "sel" : ""}">
    <div class="thumb"><div class="sil car" style="width:150px;height:50px"></div></div>
    <div class="grow"><div class="flex ac g12"><span class="tierrating" style="height:36px;font-size:26px;padding:0 9px;gap:8px"><span>${v[0]}</span><span>${v[1]}</span></span><span class="t-label c-2">${v[2]}</span></div>
      <div class="t-tile" style="margin-top:12px">${v[3]}</div></div>
    ${v[4] ? `<span class="chip">SPAWNED</span>` : `<span class="t-label c-muted">PARKED</span>`}</div>`;
P.page(`
  ${P.freeroam({open:0,speed:0,sidePanel:1})}
  <div class="sidepanel">
    <div class="flex ac g12" style="height:56px"><div class="titlemark" style="width:22px;height:40px;background:repeating-linear-gradient(135deg,var(--pink) 0 6px,transparent 6px 11px)"></div>
      <div class="t-sect" style="font-size:46px">MY VEHICLES <span class="t-status c-2" style="margin-left:10px">6</span></div></div>
    <div class="flex g8" style="margin:16px 0 14px">${P.dropdown("CATEGORY","ALL",265)}${P.dropdown("SORT","RATING",265)}</div>
    <div class="list">
      <div class="row"><div class="thumb"><i class="ic plus" style="font-size:54px;color:rgba(243,240,255,.6)"></i></div>
        <div class="grow"><div class="t-label c-2">DEALERSHIP</div><div class="t-tile" style="margin-top:12px">BUY MORE</div></div><i class="ic right" style="font-size:32px;color:var(--text2)"></i></div>
      ${owned.map(vrow).join("")}
      <div class="scrollbar"></div>
    </div>
    <div class="t-label c-2" style="margin:16px 0 12px">SELECT A VEHICLE TO SPAWN IT</div>
    ${P.btn("DESPAWN","close","md danger block")}
  </div>
`);
</script></body></html>
